name: Bug 报告
description: 反馈可复现的功能问题（请勿包含账号、课表或个人数据）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：已搜索现有 Issue、使用最新版本、问题可复现。
        **请勿粘贴真实账号密码、课表、姓名、设备序列号等个人信息。**
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 → 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: HUAWEI Pura 70 Pro+，HarmonyOS 26
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用 Demo 数据描述操作路径
      placeholder: |
        1. 打开「课表」
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 可附截图；请先打码个人课程/账号信息
    validations:
      required: true
